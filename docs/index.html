/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

  font: var(--wr) 13px/1.25 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }

:focus-visible { outline: 3.5px solid color-mix(in srgb, var(--accent) var(--ring-alpha), transparent); outline-offset: 1px; border-radius: 6px; }
.gfield :focus-visible { outline: none; }

/* Off Apple devices there's no San Francisco font, so Inter is tuned to read

.no-sf body { letter-spacing: -0.011em; font-optical-sizing: auto; font-feature-settings: "cv05", "ss03", "calt"; }
.no-sf .mono, .no-sf .code pre { letter-spacing: 0; }

/* macOS overlay scrollbars: thin, no track or arrows, only while hovering. */
@supports selector(::-webkit-scrollbar) {
  ::-webkit-scrollbar { width: 11px; height: 11px; background: transparent; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 6px; background-clip: padding-box; background-color: transparent; }
  :hover::-webkit-scrollbar-thumb { background-color: var(--scroll-thumb); }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--scroll-thumb) 100%, var(--label) 25%); }
}
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *:hover { scrollbar-color: var(--scroll-thumb) transparent; }
}

/* ---------- Desktop ---------- */
.desk { position: fixed; inset: 0; background: var(--wall); overflow: hidden; }

@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }
.waves { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }

  display: flex; align-items: flex-end; gap: 4px; padding: 6px; border-radius: 24px;
  background: var(--dock-bg); border: .5px solid var(--dock-border);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: 0 10px 30px rgba(0,0,0,.18);

.dock-item:hover .tip, .dock-item:focus-visible .tip { opacity: 1; }

@keyframes bounce { 30% { transform: translateY(-18px); } 60% { transform: translateY(0); } 80% { transform: translateY(-6px); } }

/* ---------- Window (GlassWindow) ---------- */
.window {

  box-shadow: var(--win-shadow); background: transparent;
  transition: opacity 160ms ease, transform 160ms ease;

/* ---------- GlassPage ---------- */
.page { display: none; flex-direction: column; flex: 1; min-height: 0; }

    const toggle = Button({ label: codeOpen ? "Hide code" : "Show code", style: "plain", size: "small", iconName: "code" });
    toggle.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      toggle.lastChild.textContent = panel.hidden ? "Show code" : "Hide code";
    });
    head.append(toggle);
    el.append(panel);
    el.code = panel;
  }
  el.group = group; el.foot = foot;
  return el;
}

/* ---------- code blocks ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function highlight(src, lang) {
  if (lang === "shell") return src.split("\n").map(l => l.startsWith("#") ? `<span class="c">${esc(l)}</span>` : esc(l).replace(/^(\w[\w-]*)/, '<span class="k">$1</span>')).join("\n");
  if (lang === "yaml") return src.split("\n").map(l => {
    const m = l.match(/^(\s*)([\w.-]+)(:)(.*)$/);
    if (l.trim().startsWith("#")) return `<span class="c">${esc(l)}</span>`;
    return m ? `${m[1]}<span class="t">${esc(m[2])}</span>${m[3]}<span class="s">${esc(m[4])}</span>` : esc(l);
  }).join("\n");
  const re = /(\/\/[^\n]*)|('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|\b(import|export|class|extends|with|const|final|var|void|return|await|async|if|else|for|in|new|true|false|null|static|late|required|super|this|show|switch|case|default|int|double|bool)\b|(\b0x[0-9A-Fa-f]+\b|\b\d+(?:\.\d+)?\b)|(@\w+)|\b([A-Z]\w*)\b|\b([a-z_]\w*)(?=:(?!:))/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "n" : m[5] ? "a" : m[6] ? "t" : "p";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function CodeBlock(src, lang = "dart") {
  const pre = h("pre", { tabindex: "0" });
  const el = h("div", { class: "code" }, pre);
  const copy = Button({ label: "Copy", size: "small", iconName: "copy" });
  copy.classList.add("copy");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(el.src); }
    catch { const ta = h("textarea", { style: { position: "fixed", opacity: "0" } }); ta.value = el.src; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    copy.lastChild.textContent = "Copied";
    setTimeout(() => (copy.lastChild.textContent = "Copy"), 1400);
  });
  el.append(copy);
  el.update = s => { el.src = s.trim(); pre.innerHTML = highlight(el.src, lang); };
  el.update(src);
  return el;
}

/* =====================================================================
   Window, sidebar, routing
   ===================================================================== */
const content = $("#content");
const built = {};
const sbRows = {};
let current = null;
const mobileMq = matchMedia("(max-width: 760px)");

// Sidebar search (GlassSidebar filters as you type; Return opens the first match)
let visible = NAV.map(n => n.id);
const search = TextField({ placeholder: "Search", capsule: true, prefixIcon: "search",
  onInput: v => {
    const q = v.trim().toLowerCase();
    visible = NAV.filter(n => !q || n.label.toLowerCase().includes(q)).map(n => n.id);
    NAV.forEach(n => (sbRows[n.id].hidden = !visible.includes(n.id)));
    empty.hidden = visible.length > 0;
  },
  onEnter: () => visible.length && go(visible[0]) });
$("#sb-search").append(search);
const list = $("#sb-list");
NAV.forEach(n => {
  const row = h("button", { class: "sb-row", type: "button", onclick: () => go(n.id) }, IconTile(n.icon, n.color, 22), h("span", {}, n.label), h("span", { class: "chev" }, icon("chevR", 12, 2.4)));
  sbRows[n.id] = row; list.append(row);
});
const empty = h("div", { class: "sb-empty", hidden: true }, "No results");
list.append(empty);

function go(id) { const next = id ? "#/" + id : "#/"; if (location.hash !== next) location.hash = next; else route(); }
function route() {
  let id = location.hash.replace(/^#\/?/, "");
  if (!PAGES[id]) id = "";
  const phone = mobileMq.matches;
  const show = id || (phone ? "" : "overview");
  winEl.classList.toggle("show-page", !!id && phone);
  if (!show) { Object.values(sbRows).forEach(r => r.removeAttribute("aria-current")); return; }
  if (!built[show]) { built[show] = PAGES[show](); content.append(built[show]); }
  if (current && current !== built[show]) current.classList.remove("on");
  current = built[show]; current.classList.add("on");
  Object.entries(sbRows).forEach(([k, r]) => (k === show ? r.setAttribute("aria-current", "page") : r.removeAttribute("aria-current")));
  document.title = (show === "overview" ? "macos_glass – Liquid Glass widgets for Flutter" : `${NAV.find(n => n.id === show).label} · macos_glass`);
}
addEventListener("hashchange", route);
mobileMq.addEventListener("change", () => { route(); placeWindow(); });

/* ---- window geometry: drag, resize, zoom, minimize, close ---- */
const MB = 28, DOCK = 84;
let geom = null, zoomed = false, saved = null;
const area = () => ({ x: 0, y: MB, w: innerWidth, h: innerHeight - MB - DOCK });
function setGeom(g) { geom = g; Object.assign(winEl.style, { left: g.x + "px", top: g.y + "px", width: g.w + "px", height: g.h + "px" }); }
function placeWindow() {
  if (mobileMq.matches) return;
  const a = area();
  if (zoomed) return setGeom({ x: 8, y: a.y + 8, w: a.w - 16, h: a.h - 8 });
  if (!geom) {
    const w = Math.min(1080, a.w - 64), hh = Math.min(720, a.h - 24);
    return setGeom({ x: Math.round((a.w - w) / 2), y: Math.round(a.y + Math.max(10, (a.h - hh) / 2)), w, h: hh });
  }
  const w = Math.min(geom.w, a.w - 16), hh = Math.min(geom.h, a.h - 8);
  setGeom({ w, h: hh, x: Math.min(Math.max(geom.x, -w + 120), a.w - 120), y: Math.min(Math.max(geom.y, MB), innerHeight - 60) });
}
addEventListener("resize", placeWindow);
function toggleZoom() {
  if (mobileMq.matches) return;
  winEl.classList.add("animating");
  if (!zoomed) { saved = geom; zoomed = true; placeWindow(); }
  else { zoomed = false; setGeom(saved); }
  setTimeout(() => winEl.classList.remove("animating"), 280);
}
winEl.addEventListener("pointerdown", e => {
  const band = e.target.closest("[data-drag]");
  if (!band || mobileMq.matches || e.button !== 0 || e.target.closest("button,input,textarea,a,[role=switch],.gseg")) return;
  const sx = e.clientX, sy = e.clientY, g0 = { ...geom };
  band.setPointerCapture(e.pointerId);
  const move = ev => { zoomed = false; setGeom({ ...g0, x: g0.x + ev.clientX - sx, y: Math.max(MB, g0.y + ev.clientY - sy) }); };
  const up = () => { band.removeEventListener("pointermove", move); band.removeEventListener("pointerup", up); };
  band.addEventListener("pointermove", move); band.addEventListener("pointerup", up);
});
winEl.addEventListener("dblclick", e => { if (e.target.closest("[data-drag]") && !e.target.closest("button,input,.gseg")) toggleZoom(); });
winEl.querySelectorAll("[data-rz]").forEach(handle => handle.addEventListener("pointerdown", e => {
  const kind = handle.dataset.rz, sx = e.clientX, sy = e.clientY, g0 = { ...geom };
  handle.setPointerCapture(e.pointerId);
  const move = ev => { zoomed = false; setGeom({ ...g0, w: kind.includes("r") ? Math.max(720, g0.w + ev.clientX - sx) : g0.w, h: kind.includes("b") ? Math.max(520, g0.h + ev.clientY - sy) : g0.h }); };
  const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); };
  handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
}));
[["close", "xmark"], ["min", "minus"], ["zoom", "arrowsOut"]].forEach(([a, n]) => $(`.light.${a}`).append(icon(n, 8, 3.2)));

let winState = "open";
function dockIconRect() { return $("#dock-gallery").getBoundingClientRect(); }
function hideWindow(kind) {
  if (winState !== "open") return;
  const r = winEl.getBoundingClientRect();
  const d0 = dockIconRect(), d = d0.width ? d0 : new DOMRect(innerWidth / 2, innerHeight, 0, 0);
  winEl.classList.add("genie");
  winEl.style.transformOrigin = `${d.left + d.width / 2 - r.left}px ${d.top - r.top}px`;
  winEl.style.transform = "scale(.06)"; winEl.style.opacity = "0";
  winState = kind;
  setTimeout(() => { winEl.classList.add("hidden"); winEl.classList.remove("genie"); }, 380);
  document.body.classList.remove("win-open");
  $("#dock-gallery").classList.toggle("running", kind === "min");
}
function showWindow() {
  if (winState === "open") { const g = $("#dock-gallery"); g.classList.remove("bounce"); void g.offsetWidth; g.classList.add("bounce"); return; }
  winEl.classList.remove("hidden");
  winEl.classList.add("genie");
  requestAnimationFrame(() => { winEl.style.transform = ""; winEl.style.opacity = ""; });
  setTimeout(() => winEl.classList.remove("genie"), 400);
  winState = "open";
  document.body.classList.add("win-open");
  $("#dock-gallery").classList.add("running");
}
$("#lights").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "close") hideWindow("closed");
  if (act === "min") hideWindow("min");
  if (act === "zoom") toggleZoom();
});

/* ---- Dock ---- */
const dock = $("#dock");
const DOCK_ITEMS = [
  { id: "dock-gallery", name: "macos_glass Gallery", icon: "sliders", color: "#007AFF", run: showWindow },
  { id: "dock-docs", name: "API Reference", icon: "book", color: "#FF9F0A", run: () => open(LINKS.docs) },
  { id: "dock-pub", name: "pub.dev", icon: "box", color: "#0EA5C6", run: () => open(LINKS.pub) },
  { id: "dock-gh", name: "Source on GitHub", icon: "code", color: "#3A3A3C", run: () => open(LINKS.github) },
  { sep: true },
  { id: "dock-trash", name: "Trash", icon: "trash", color: "#AEAEB2", run: () => showGlassAlert({ root: deskOverlay, title: "Empty the Trash?", message: "Items in the Trash will be deleted immediately. (It's a demo — nothing will be deleted.)", primaryLabel: "Empty Trash", secondaryLabel: "Cancel", destructive: true, iconTile: IconTile("trash", "#FF453A", 44) }) },
];
DOCK_ITEMS.forEach(it => {
  if (it.sep) return dock.append(h("div", { class: "dock-sep" }));
  const tile = IconTile(it.icon, it.color, 50);
  tile.style.width = tile.style.height = "100%"; tile.style.borderRadius = "26%";
  tile.firstChild.setAttribute("width", "58%"); tile.firstChild.setAttribute("height", "58%");
  dock.append(h("button", { class: "dock-item" + (it.id === "dock-gallery" ? " running" : ""), id: it.id, type: "button", "aria-label": it.name, onclick: it.run }, tile, h("span", { class: "tip" }, it.name), h("span", { class: "dot" })));
});
const dockItems = [...dock.querySelectorAll(".dock-item")];
dock.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  dock.classList.add("tracking");
  dockItems.forEach(it => {
    const r = it.getBoundingClientRect();
    const d = Math.abs(e.clientX - (r.left + r.width / 2));
    const s = 50 * (1 + 0.42 * Math.max(0, 1 - d / 120));
    it.style.width = it.style.height = s + "px";
  });
});
dock.addEventListener("pointerleave", () => { dock.classList.remove("tracking"); dockItems.forEach(it => (it.style.width = it.style.height = "")); });

/* ---- Menu bar ---- */
$("#mb-logo").append(icon("drop", 15, 2.4));
const MENUS = {
  app: () => [{ value: "about", label: "About macos_glass" }, { separator: true }, { value: "pub", label: "Open on pub.dev" }, { value: "gh", label: "Open on GitHub" }],
  file: () => [{ value: "folder", label: "New Folder…" }, { value: "close", label: "Close Window", enabled: winState === "open" }],
  view: () => [{ value: "light", label: "Light" }, { value: "dark", label: "Dark" }, { value: "system", label: "Match System" }, { separator: true }, { value: "accent", label: "Accent Colour…" }],
  window: () => [{ value: "min", label: "Minimize", enabled: winState === "open" }, { value: "zoom", label: "Zoom", enabled: winState === "open" && !mobileMq.matches }, { separator: true }, { value: "show", label: "macos_glass Gallery" }],
  help: () => [{ value: "docs", label: "API Reference" }, { value: "changelog", label: "Changelog" }, { value: "issue", label: "Report an Issue…" }],
};
function runMenu(v) {
  ({
    about: () => showGlassAlert({ root: deskOverlay, title: "macos_glass " + VERSION, message: "macOS 26 Liquid Glass widgets for Flutter desktop. MIT © 2026 Mostafijur Rahman.", primaryLabel: "OK", iconTile: IconTile("drop", "var(--accent)", 52) }),
    pub: () => open(LINKS.pub), gh: () => open(LINKS.github), docs: () => open(LINKS.docs), changelog: () => open(LINKS.changelog), issue: () => open(LINKS.issues),
    folder: () => { showWindow(); go("dialogs"); setTimeout(() => built.dialogs.querySelectorAll(".gsec")[1].querySelector("button.gbtn:not(.plain)").click(), 120); },
    close: () => hideWindow("closed"), min: () => hideWindow("min"), zoom: toggleZoom, show: showWindow,
    light: () => setTheme({ mode: "light" }), dark: () => setTheme({ mode: "dark" }), system: () => setTheme({ mode: "system" }),
    accent: () => { showWindow(); go("theme"); },
  }[v] || (() => {}))();
}
let openMenu = null;
async function openMenubar(btn) {
  if (openMenu) openMenu.p.close(null);
  btn.classList.add("open");
  const r = btn.getBoundingClientRect();
  const isView = btn.dataset.menu === "view";
  const p = showGlassMenu({ anchor: new DOMRect(r.left, r.top, 200, r.height), items: MENUS[btn.dataset.menu](), root: deskOverlay, minWidth: 200, hasSelection: isView, selected: isView ? theme.mode : undefined });
  openMenu = { p, btn };
  const res = await p;
  btn.classList.remove("open");
  if (openMenu && openMenu.p === p) openMenu = null;
  if (res) runMenu(res.value);
}
document.querySelectorAll("[data-menu]").forEach(btn => {
  btn.addEventListener("pointerdown", e => { e.preventDefault(); if (openMenu && openMenu.btn === btn) { openMenu.p.close(null); return; } openMenubar(btn); });
  btn.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { e.preventDefault(); openMenubar(btn); } });
  btn.addEventListener("pointerenter", () => { if (openMenu && openMenu.btn !== btn) openMenubar(btn); });
});
// While a menu is open, its layer covers the menu bar; let hovering other titles switch menus.
deskOverlay.addEventListener("pointermove", e => {
  if (!openMenu || e.clientY > MB) return;
  const t = [...document.querySelectorAll("[data-menu]")].find(b => { const r = b.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right; });
  if (t && t !== openMenu.btn) openMenubar(t);
});
const themeBtn = $("#mb-theme");
themeBtn.addEventListener("click", () => setTheme({ mode: { system: "light", light: "dark", dark: "system" }[theme.mode] }));
themeSubs.add(() => { themeBtn.replaceChildren(icon({ system: "half", light: "sun", dark: "moon" }[theme.mode], 15, 2)); themeBtn.title = `Appearance: ${{ system: "Match System", light: "Light", dark: "Dark" }[theme.mode]} (click to change)`; });
const clock = $("#mb-clock");
const tick = () => {
  const d = new Date();
  const small = innerWidth < 520;
  clock.textContent = small ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" }) + "  " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
};
tick(); setInterval(tick, 15000);

function open(url) { window.open(url, "_blank", "noopener"); }

/* ---- start ---- */
applyTheme();
placeWindow();
document.body.classList.add("win-open");
route();
