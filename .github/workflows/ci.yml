name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib || true
      - run: flutter analyze
      - run: flutter test
      - name: Build example (macOS)
        working-directory: example
        run: |
          flutter create --platforms=macos .
          flutter pub get
          flutter build macos --debug
