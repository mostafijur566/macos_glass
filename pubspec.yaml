name: macos_glass
description: "macOS 26 Liquid Glass widgets for Flutter desktop: System Settings-style window, translucent sidebar, grouped forms, switches, menus and sheets."
version: 0.1.3
homepage: https://github.com/mostafijur566/macos_glass
repository: https://github.com/mostafijur566/macos_glass
issue_tracker: https://github.com/mostafijur566/macos_glass/issues
topics:
  - macos
  - desktop
  - ui
  - widgets
  - design-system

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

platforms:
  macos:

dependencies:
  flutter:
    sdk: flutter
  # Native window chrome: transparent title bar, sidebar blur, toolbar passthrough.
  macos_window_utils: ^1.9.1
  # SF-style glyphs used by the widgets (chevrons, check marks, search).
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
